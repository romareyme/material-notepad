[package]
name = "material-notepad"
version = "1.0.0"
edition = "2021"
description = "Material Notepad: a Rust text editor with a Material You interface, forked from Notepad Next"
license = "GPL-3.0-or-later"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = "0.27.2"
rfd = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
